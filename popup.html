<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        color-scheme: light;
      }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        width: 260px;
        padding: 12px;
        color: #1f2328;
        background: #ffffff;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 4px;
      }
      #domain {
        font-weight: 600;
        color: #0969da;
        word-break: break-all;
      }
      #status {
        font-size: 12px;
        color: #57606a;
        margin: 4px 0 12px;
        min-height: 15px;
      }
      button {
        display: block;
        width: 100%;
        padding: 8px 10px;
        margin-bottom: 8px;
        font-size: 13px;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        background: #f6f8fa;
        color: #1f2328;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: #eef1f4;
      }
      button.primary {
        background: #0969da;
        border-color: #0969da;
        color: #ffffff;
      }
      button.primary:hover:not(:disabled) {
        background: #0860c4;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <h1>Element Highlighter</h1>
    <div id="domain"></div>
    <div id="status">Loading…</div>
    <button id="toggle" class="primary">Start Highlight Mode</button>
    <button id="reset">Reset Highlights for this Domain</button>
    <script src="popup.js"></script>
  </body>
</html>
